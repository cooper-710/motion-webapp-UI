<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#ff8a27" />
    <meta
      name="description"
      content="SEQUENCE Motion Viewer — play FBX motion and view synced biomechanical signals."
    />

    <!-- Make all relative URLs resolve from the current folder (works on subpaths like GitHub Pages) -->
    <base href="./" />

    <!-- Brand icons (relative paths so they work under a subpath) -->
    <link rel="icon" type="image/png" href="Logo.png" />
    <link rel="apple-touch-icon" href="Logo.png" />

    <title>SEQUENCE • Motion Viewer</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Relative module path; Vite rewrites this on build -->
    <script type="module" src="src/main.tsx"></script>
  <button id="theme-fab" style="position:fixed;right:14px;bottom:14px;z-index:9999;padding:10px 12px;border-radius:12px;border:1px solid rgba(0,0,0,.08);box-shadow:0 8px 24px rgba(0,0,0,.25);background:#fff;cursor:pointer">☀︎/☾</button>
<script>document.getElementById("theme-fab").onclick=function(){var r=document.documentElement;var next=r.dataset.theme==="light"?"":"light";r.dataset.theme=next;localStorage.setItem("theme",next||"dark");};</script>
</body>
</html>
